name: Ryan Camera Test

on:
  push:
    branches:
      - ryan-cam-test
      - ryan-cam-snapshot
      - ryan-cam-stream
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:v6.1

    strategy:
      fail-fast: false
      matrix:
        # ryan-cam-snapshot test builds (OLED 128x32). Artifact names differ from the
        # stable ryan-cam-test artifacts so both can be kept for rollback.
        include:
          # Stage 1 only: frame buffer lifecycle fix, /snapshot disabled (default config)
          - config: config.json
            artifact: stage1-bread-compact-wifi
          # Camera HTTP server on port 8080: /snapshot and /stream
          - config: config.snapshot-test.json
            artifact: http-bread-compact-wifi

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build firmware
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/build.py bread-compact-wifi -c ${{ matrix.config }} --name bread-compact-wifi

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.ref_name }}-${{ matrix.artifact }}
          path: build/merged-binary.bin
          if-no-files-found: error
