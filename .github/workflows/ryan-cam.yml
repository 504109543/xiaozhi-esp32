name: Ryan Camera Test

on:
  push:
    branches:
      - ryan-cam-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:v6.1

    strategy:
      fail-fast: false
      matrix:
        name:
          - bread-compact-wifi
          - bread-compact-wifi-128x64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build firmware
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/build.py bread-compact-wifi --name ${{ matrix.name }}

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: ryan-cam-${{ matrix.name }}
          path: build/merged-binary.bin
          if-no-files-found: error
