name: Ryan Wi-Fi A/B

on:
  push:
    branches:
      - ryan-wifi-ab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:v6.1

    strategy:
      fail-fast: false
      matrix:
        include:
          # A: camera off + Wi-Fi always performance
          - variant: nocam-perf
            camera: 0
            perf: 1
          # B: camera on + Wi-Fi always performance
          - variant: cam-perf
            camera: 1
            perf: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply A/B switches
        shell: bash
        run: |
          f=main/boards/bread-compact-wifi/config.h
          sed -i 's/^#define RYAN_AB_ENABLE_CAMERA 1$/#define RYAN_AB_ENABLE_CAMERA ${{ matrix.camera }}/' $f
          sed -i 's/^#define RYAN_AB_WIFI_ALWAYS_PERFORMANCE 0$/#define RYAN_AB_WIFI_ALWAYS_PERFORMANCE ${{ matrix.perf }}/' $f
          grep -n "RYAN_AB_" $f

      - name: Build firmware
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/build.py bread-compact-wifi --name bread-compact-wifi

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: ryan-wifi-ab-${{ matrix.variant }}
          path: build/merged-binary.bin
          if-no-files-found: error
